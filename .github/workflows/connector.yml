# Costruisce l'immagine del connettore e la pubblica su GHCR, legata a questo
# repo. Pubblica è gratis e senza limiti di pull, e non serve nessun account
# altrove.
name: connector

on:
  push:
    tags: ['connector-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 serve per i Raspberry, ed è metà del motivo per cui si costruisce qui.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Due etichette per ogni rilascio: quella esatta (1.2.0), che non cambia
      # mai, e quella grossa (1), che si sposta. Le case seguono la seconda,
      # così watchtower porta le correzioni e non porta le rotture: una
      # versione che rompe esce come 2, e nessuno la prende per sbaglio.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/place-index-connector
          tags: |
            type=match,pattern=connector-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=connector-v(\d+),group=1

      # Il tag e il package.json devono dire lo stesso numero: se qualcuno si
      # dimentica di uno dei due, meglio saperlo qui che scoprirlo dai log di
      # una casa.
      - name: il numero combacia
        run: |
          scritto=$(node -p "require('./connector/package.json').version")
          taggato="${{ steps.meta.outputs.version }}"
          if [ "$scritto" != "$taggato" ]; then
            echo "package.json dice $scritto, il tag dice $taggato"
            exit 1
          fi

      - uses: docker/build-push-action@v6
        with:
          # La radice del repo, perché serve anche shared/: il contratto.
          context: .
          file: connector/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
