<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#111418" />
    <title>Place Index</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>" />
  </head>
  <body>
    <div id="map"></div>

    <!-- Search + category filters -->
    <div id="panel">
      <form id="search" autocomplete="off">
        <input id="search-input" type="search" placeholder="Cerca un indirizzo o un posto…" />
        <button type="submit" title="Cerca">⌕</button>
      </form>
      <ul id="search-results" hidden></ul>

      <div id="filters"></div>

      <button id="manage-btn" class="link-btn" type="button">Gestisci categorie</button>
    </div>

    <button id="add-btn" type="button">＋ Aggiungi posto</button>

    <div id="hint" hidden>Clicca sulla mappa per scegliere il punto · <kbd>Esc</kbd> annulla</div>

    <!-- Add / edit place -->
    <aside id="place-sheet" hidden>
      <header>
        <h2 id="place-title">Nuovo posto</h2>
        <button class="close" type="button" data-close>×</button>
      </header>
      <form id="place-form">
        <label>Nome<input name="name" required maxlength="80" placeholder="Es. Trattoria da Nonna" /></label>
        <span class="label">Categoria</span>
        <div id="category-choice" class="chips"></div>
        <label>Indirizzo / note<textarea name="note" maxlength="500" rows="2" placeholder="Via Roma 1 · il piatto da non perdere…"></textarea></label>
        <p id="coords" class="coords"></p>
        <div class="actions">
          <button type="button" class="ghost" data-delete hidden>Elimina</button>
          <button type="button" class="ghost" data-close>Annulla</button>
          <button type="submit" class="primary">Salva</button>
        </div>
      </form>
    </aside>

    <!-- Category manager -->
    <aside id="category-sheet" hidden>
      <header>
        <h2>Categorie</h2>
        <button class="close" type="button" data-close>×</button>
      </header>
      <ul id="category-list"></ul>
      <form id="category-form">
        <button type="button" id="new-emoji" class="emoji-btn" title="Scegli emoji">📍</button>
        <input name="name" required maxlength="40" placeholder="Nuova categoria" />
        <input name="color" type="color" value="#2274a5" title="Colore" />
        <button type="submit" class="primary">Aggiungi</button>
      </form>
    </aside>

    <div id="emoji-popover" hidden><emoji-picker class="light"></emoji-picker></div>

    <div id="toast" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
