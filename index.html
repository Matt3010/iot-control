<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <title>Place Index</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>" />
  </head>
  <body>
    <div id="map"></div>

    <!-- Left rail: identity, search, filters -->
    <div id="panel" class="surface">
      <div class="panel-head">
        <span class="wordmark">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 10c0 5.25-8 12-8 12s-8-6.75-8-12a8 8 0 1 1 16 0Z" />
            <circle cx="12" cy="10" r="2.75" />
          </svg>
          Place Index
        </span>
        <span id="place-count" class="tally">0</span>
      </div>

      <form id="search" autocomplete="off">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.6-3.6" />
        </svg>
        <input id="search-input" type="search" placeholder="Cerca un indirizzo o un posto" />
        <button type="submit" class="ghost-icon" title="Cerca">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13m0 0-5-5m5 5-5 5" /></svg>
        </button>
      </form>
      <ul id="search-results" hidden></ul>

      <div class="panel-row">
        <span class="eyebrow">Categorie</span>
        <button id="manage-btn" class="ghost-icon" type="button" title="Gestisci categorie">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h10M18 7h2M4 17h4M12 17h8" />
            <circle cx="16" cy="7" r="2.2" />
            <circle cx="10" cy="17" r="2.2" />
          </svg>
        </button>
      </div>
      <div id="filters"></div>
    </div>

    <button id="add-btn" type="button">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
      <span class="add-label">Aggiungi posto</span>
    </button>

    <div id="hint" hidden>
      Clicca sulla mappa per scegliere il punto
      <kbd>Esc</kbd>
    </div>

    <!-- Add / edit place -->
    <aside id="place-sheet" class="surface" hidden>
      <header>
        <h2 id="place-title">Nuovo posto</h2>
        <button class="ghost-icon" type="button" data-close title="Chiudi">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
      </header>
      <form id="place-form">
        <label class="field">
          <span class="eyebrow">Nome</span>
          <input name="name" required maxlength="80" placeholder="Trattoria da Nonna" />
        </label>
        <div class="field">
          <span class="eyebrow">Categoria</span>
          <div id="category-choice" class="chips"></div>
        </div>
        <label class="field">
          <span class="eyebrow">Note</span>
          <textarea name="note" maxlength="500" rows="3" placeholder="Indirizzo, il piatto da non perdere, con chi ci sei stato…"></textarea>
        </label>
        <p id="coords" class="coords"></p>
        <div class="actions">
          <button type="button" class="danger-link" data-delete hidden>
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13M10 11v6M14 11v6" />
            </svg>
            Elimina
          </button>
          <button type="button" class="ghost" data-close>Annulla</button>
          <button type="submit" class="primary">Salva</button>
        </div>
      </form>
    </aside>

    <!-- Category manager -->
    <aside id="category-sheet" class="surface" hidden>
      <header>
        <h2>Categorie</h2>
        <button class="ghost-icon" type="button" data-close title="Chiudi">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
      </header>
      <ul id="category-list"></ul>
      <form id="category-form">
        <span class="eyebrow">Nuova categoria</span>
        <div class="category-row">
          <button type="button" id="new-emoji" class="emoji-btn" title="Scegli emoji">📍</button>
          <input name="name" required maxlength="40" placeholder="Es. Pizzeria" />
          <label class="swatch" title="Colore">
            <input name="color" type="color" value="#e4572e" />
          </label>
        </div>
        <button type="submit" class="primary">Aggiungi categoria</button>
      </form>
    </aside>

    <div id="emoji-popover" class="surface" hidden><emoji-picker></emoji-picker></div>

    <div id="toast" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
