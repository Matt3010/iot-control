<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <title>Place Index</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>" />
  </head>
  <body>
    <div id="map"></div>

    <!-- Left rail: identity, search, filters, the index itself -->
    <div id="panel" class="surface">
      <div class="panel-head">
        <span class="wordmark"><i data-icon="pin"></i> Place Index</span>
        <span id="place-count" class="tally">0</span>
      </div>

      <form id="search" autocomplete="off">
        <i data-icon="search"></i>
        <input id="search-input" type="search" placeholder="Cerca un indirizzo o un posto" />
        <button type="submit" class="ghost-icon" title="Cerca"><i data-icon="submit"></i></button>
      </form>
      <ul id="search-results" hidden></ul>

      <div class="panel-row">
        <span class="eyebrow">Categorie</span>
        <button id="manage-btn" class="ghost-icon" type="button" title="Gestisci categorie">
          <i data-icon="filters"></i>
        </button>
      </div>
      <div id="filters"></div>

      <div class="panel-row" id="list-head" hidden>
        <span class="eyebrow">In vista</span>
        <span id="list-count" class="tally">0</span>
      </div>
      <ul id="place-list" hidden></ul>
    </div>

    <button id="add-btn" type="button">
      <i data-icon="plus"></i>
      <span class="add-label">Aggiungi posto</span>
    </button>

    <div id="hint" hidden>
      Clicca sulla mappa per scegliere il punto
      <kbd>Esc</kbd>
    </div>

    <!-- Add / edit place -->
    <aside id="place-sheet" class="surface" hidden>
      <header>
        <h2 id="place-title">Nuovo posto</h2>
        <button class="ghost-icon" type="button" data-close title="Chiudi"><i data-icon="close"></i></button>
      </header>
      <form id="place-form">
        <label class="field">
          <span class="eyebrow">Nome</span>
          <input name="name" required maxlength="80" placeholder="Trattoria da Nonna" />
        </label>
        <div class="field">
          <span class="eyebrow">Categoria</span>
          <div id="category-choice" class="chips"></div>
        </div>
        <label class="field">
          <span class="eyebrow">Note</span>
          <textarea name="note" maxlength="500" rows="3" placeholder="Indirizzo, il piatto da non perdere, con chi ci sei stato…"></textarea>
        </label>
        <p id="coords" class="coords"></p>
        <div class="actions">
          <button type="button" class="danger-link" data-delete hidden>
            <i data-icon="trash"></i> Elimina
          </button>
          <button type="button" class="ghost" data-close>Annulla</button>
          <button type="submit" class="primary">Salva</button>
        </div>
      </form>
    </aside>

    <!-- Category manager -->
    <aside id="category-sheet" class="surface" hidden>
      <header>
        <h2>Categorie</h2>
        <button class="ghost-icon" type="button" data-close title="Chiudi"><i data-icon="close"></i></button>
      </header>
      <ul id="category-list"></ul>
      <form id="category-form">
        <span class="eyebrow">Nuova categoria</span>
        <div class="category-row">
          <button type="button" id="new-emoji" class="emoji-btn" title="Scegli emoji">📍</button>
          <input name="name" required maxlength="40" placeholder="Es. Pizzeria" />
          <label class="swatch" title="Colore">
            <input name="color" type="color" value="#e4572e" />
          </label>
        </div>
        <button type="submit" class="primary">Aggiungi categoria</button>
      </form>
    </aside>

    <div id="emoji-popover" class="surface" hidden><emoji-picker></emoji-picker></div>

    <div id="toast" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
